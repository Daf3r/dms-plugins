# claude-usage — consumo de la suscripción de Claude en la barra de Noctalia.
# Diseño: docs/superpowers/specs/2026-08-07-claude-usage-noctalia-design.md
# Sucede al plugin homónimo de Caelestia, bloqueado por un sistema de plugins
# que nunca se mergeó.

id = "daf3r/claude-usage"
name = "Claude Usage"
version = "0.1.0"
# 3 cubriría [[widget]], [[panel]], [[service]] y los controles ui.*, pero el
# servicio llama a noctalia.nowMs(), que noctalia.d.luau marca como Plugin API
# 12: todo el modelo trabaja en epoch de milisegundos y os.time solo da
# segundos enteros. Declarar 3 y usar una función de nivel 12 sería falso.
plugin_api = 12
author = "daf3r"
license = "MIT"
icon = "gauge"
description = "Consumo de la suscripción de Claude: ventana de 5 h y semanal, con avisos."
dependencies = []
tags = ["ai", "productivity", "bar", "panel"]

# ── Ajustes (spec §10) ────────────────────────────────────────────────────────
# Los defaults se repiten en logic.luau (DEFAULT_*). El parser del manifiesto
# no puede leer Luau, así que la duplicación es inevitable; tests/manifest.test.luau
# comprueba que no divergen.

[[setting]]
key = "warn_threshold"
type = "int"
label_key = "settings.warn_threshold.label"
description_key = "settings.warn_threshold.description"
default = 90
min = 50
max = 99

[[setting]]
key = "idle_interval"
type = "int"
label_key = "settings.idle_interval.label"
description_key = "settings.idle_interval.description"
default = 300
min = 60
max = 3600

[[setting]]
key = "alert_interval"
type = "int"
label_key = "settings.alert_interval.label"
description_key = "settings.alert_interval.description"
default = 60
min = 15
max = 600

[[setting]]
key = "show_scoped_limits"
type = "bool"
label_key = "settings.show_scoped_limits.label"
default = true

[[setting]]
key = "show_extra_usage"
type = "bool"
label_key = "settings.show_extra_usage.label"
default = true

[[setting]]
key = "show_remaining"
type = "bool"
label_key = "settings.show_remaining.label"
description_key = "settings.show_remaining.description"
default = false

# ── Entradas ──────────────────────────────────────────────────────────────────
# El servicio es el único dueño de la red, los ficheros y el temporizador.
# Es headless a propósito: quitar el widget de la barra no debe apagar los
# avisos.
[[service]]
id = "poller"
entry = "service.luau"

[[widget]]
id = "meter"
entry = "widget.luau"

[[panel]]
id = "detail"
entry = "panel.luau"
width = 340
# El alto es FIJO y hay que dimensionarlo a mano: no existe alto por contenido.
# `height = "auto"` se acepta sin protestar y luego se ignora —el panel sale
# exactamente igual de alto que sin ponerlo—, así que no vale como escape.
#
# Y quedarse corto no avisa de ninguna forma. Probado a 200: la fila de créditos
# sale cortada por la mitad y el pie desaparece entero, sin barra de scroll y
# sin una línea en el log. Lo primero que se pierde es justo lo que el spec §9
# protege — de dónde viene el dato y el botón de refrescar—, así que aquí se
# sobredimensiona a propósito.
#
# La cuenta, medida sobre el panel real:
#   · contenido de hoy, con sus márgenes ....... 292
#   · cada sublímite por modelo de más ......... +31
# 360 deja sitio para DOS modelos extra sobre lo que la API devuelve hoy (uno).
# Si algún día se añade una fila fija al panel, súmale su alto aquí.
#
# OJO al tocarlo: la geometría NO se recarga en caliente como los .luau. Hay que
# re-registrar el plugin para verla:
#   noctalia msg plugins disable daf3r/claude-usage
#   noctalia msg plugins enable  daf3r/claude-usage
height = 360
placement = "floating"
position = "center"
